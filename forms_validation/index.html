<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вёрстка и валидация форм</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Регистрация пользователя</h1>
            <p>Заполните форму ниже для создания аккаунта</p>
        </header>

        <main class="main">
            <form class="registration-form" id="registrationForm" novalidate>

                <fieldset class="form-section">
                    <legend>Личная информация</legend>

                    <div class="form-group">
                        <label for="firstName" class="required">Имя</label>
                        <input type="text" id="firstName" name="firstName" required
                               minlength="2" maxlength="50"
                               placeholder="Введите ваше имя">
                        <span class="error-message" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName" class="required">Фамилия</label>
                        <input type="text" id="lastName" name="lastName" required
                               minlength="2" maxlength="50"
                               placeholder="Введите вашу фамилию">
                        <span class="error-message" id="lastNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        <input type="email" id="email" name="email" required
                               placeholder="example@mail.com">
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone"
                               pattern="\+7\s?\(\d{3}\)\s?\d{3}-\d{2}-\d{2}"
                               placeholder="+7 (999) 999-99-99">
                        <span class="error-message" id="phoneError"></span>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Безопасность</legend>

                    <div class="form-group">
                        <label for="password" class="required">Пароль</label>
                        <input type="password" id="password" name="password" required
                               minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+"
                               placeholder="Не менее 8 символов">
                        <span class="error-message" id="passwordError"></span>
                        <div class="password-requirements">
                            Пароль должен содержать: заглавные и строчные буквы, цифры
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="required">Подтверждение пароля</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                               placeholder="Повторите пароль">
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>Дополнительная информация</legend>

                    <div class="form-group">
                        <label for="birthDate">Дата рождения</label>
                        <input type="date" id="birthDate" name="birthDate"
                               min="1900-01-01" max="2026-12-31">
                    </div>

                    <div class="form-group">
                        <label for="country">Страна</label>
                        <select id="country" name="country">
                            <option value="">Выберите страну</option>
                            <option value="ru">Россия</option>
                            <option value="kz">Казахстан</option>
                            <option value="by">Беларусь</option>
                            <option value="other">Другая</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <span class="group-label">Пол</span>
                        <div class="radio-group">
                            <label class="option-label">
                                <input type="radio" name="gender" value="male">
                                <span class="option-box"></span>
                                <span class="option-text">Мужской</span>
                            </label>
                            <label class="option-label">
                                <input type="radio" name="gender" value="female">
                                <span class="option-box"></span>
                                <span class="option-text">Женский</span>
                            </label>
                            <label class="option-label">
                                <input type="radio" name="gender" value="other">
                                <span class="option-box"></span>
                                <span class="option-text">Другой</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <span class="group-label">Интересы</span>
                        <div class="checkbox-group">
                            <label class="option-label">
                                <input type="checkbox" name="interests" value="programming">
                                <span class="option-box"></span>
                                <span class="option-text">Программирование</span>
                            </label>
                            <label class="option-label">
                                <input type="checkbox" name="interests" value="design">
                                <span class="option-box"></span>
                                <span class="option-text">Дизайн</span>
                            </label>
                            <label class="option-label">
                                <input type="checkbox" name="interests" value="marketing">
                                <span class="option-box"></span>
                                <span class="option-text">Маркетинг</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bio">О себе</label>
                        <textarea id="bio" name="bio" rows="4"
                                  placeholder="Расскажите немного о себе..."
                                  maxlength="500"></textarea>
                        <div class="char-counter">
                            <span id="charCount">0</span> / 500
                        </div>
                    </div>
                </fieldset>

                <div class="form-section">
                    <div class="form-group">
                        <label class="option-label option-label--block">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="option-box"></span>
                            <span class="option-text">
                                Я принимаю <a href="#">условия использования</a> и
                                <a href="#">политику конфиденциальности</a>
                            </span>
                        </label>
                        <span class="error-message" id="termsError"></span>
                    </div>

                    <div class="form-group">
                        <label class="option-label option-label--block">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <span class="option-box"></span>
                            <span class="option-text">Я хочу получать новостную рассылку</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                        <button type="reset" class="btn btn-secondary">Очистить форму</button>
                    </div>
                </div>

            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Формы и валидация</p>
        </footer>
    </div>

    <script src="script.js"></script>

</body>
</html>
